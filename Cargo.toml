[workspace]
members = ["crates/dkb-core", "crates/dkb", "crates/dk"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-segmentation = "1.12"
tempfile = "3"
